<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Text Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        #editor {
            width: 80%;
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            outline: none;
            overflow: auto;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div contenteditable="true" id="editor">Start typing here...</div>
    <button onclick="saveText()">Save as .txt</button>

    <script>
        function saveText() {
            const text = document.getElementById("editor").innerText;
            const blob = new Blob([text], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "text-editor-output.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
